aid: upload-post
url: https://raw.githubusercontent.com/api-evangelist/upload-post/refs/heads/main/apis.yml
name: Upload-Post
kind: company
description: Upload-Post is a universal social media publishing API that lets developers
  publish videos, photos, and text posts to TikTok, Instagram, YouTube, LinkedIn,
  Facebook, X (Twitter), Threads, Pinterest, Bluesky, Reddit, Discord, Telegram, and
  Google Business Profile through a single REST interface, with managed user profiles,
  OAuth account linking, scheduling, and cross-platform analytics.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Social Media
- Publishing
- Video
- Content
- Cross Posting
created: '2026-06-25'
modified: '2026-06-25'
specificationVersion: '0.19'
