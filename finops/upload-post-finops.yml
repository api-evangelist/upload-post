description: >-
  FinOps view of Upload-Post spend. Upload-Post bills via subscription plans
  rather than per-API-call usage: a free tier (10 uploads/month) and paid plans
  (billed monthly, discounted annually) that unlock API access, unlimited
  uploads, and scale by the number of connected profiles. Cost is driven by the
  chosen plan tier and the number of profiles, not by metered token or
  request consumption.
notes: >-
  Plan names and prices are subject to change; verify against the Upload-Post
  pricing page during reconciliation. Subscription-based billing means the main
  cost lever is plan/profile count rather than per-call metering.
