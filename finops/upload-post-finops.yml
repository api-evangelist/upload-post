meters:
- name: subscription_plan
  description: Recurring subscription charge for the selected plan tier.
  unit: plan
  aggregation: max
  dimensions:
  - account
  - plan
- name: connected_profiles
  description: Number of connected profiles (social accounts), the primary plan scaling factor.
  unit: profiles
  aggregation: max
  dimensions:
  - account
  - plan
- name: monthly_uploads
  description: Uploads published per month; capped on free, unlimited on paid plans.
  unit: uploads
  aggregation: sum
  dimensions:
  - account
  - profile
principles:
- name: Visibility
  description: Track plan tier, connected profile count, and monthly upload volume in the dashboard.
- name: Allocation
  description: Map managed profiles to internal clients/teams to allocate subscription cost.
- name: Optimization
  description: Right-size the plan tier to actual profile and upload needs; prefer annual billing for the discount; consolidate unused profiles.
- name: Accountability
  description: Assign an owner per profile/workspace and review the subscription against usage each billing cycle.
